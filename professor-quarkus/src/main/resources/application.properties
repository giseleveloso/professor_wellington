# Configuração do banco de dados
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = postgres
quarkus.datasource.password = 123456
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/professor_wellington

%prod.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql = false

# Configuração JWT
mp.jwt.verify.publickey.location = token/publicKey.pem
mp.jwt.verify.issuer=unitins-jwt
smallrye.jwt.sign.key.location=token/privateKey.pem

# Configuração de LOG
quarkus.log.level = INFO
quarkus.log.category."br.unitins.topicos1".level = TRACE

# Configuração do console log
quarkus.log.console.color = true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t)  %s%e%n
quarkus.log.console.level = DEBUG

# Configuração CORS (para integração com Angular)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=authorization
quarkus.http.cors.access-control-max-age=24H

# Configuração do log em arquivos (desabilitado por padrão)
#quarkus.log.file.enable=true
#quarkus.log.file.path=/tmp/log_professor_wellington.log
#quarkus.log.file.level=DEBUG
#quarkus.log.file.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t)  %s%e%n
#quarkus.log.file.rotation.file-suffix=.dd-MM-yyyy-HH-mm
# Configuração de Email (Gmail SMTP)
# Para usar Gmail, ative "Senhas de app" em https://myaccount.google.com/apppasswords
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=587
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=SEU_EMAIL@gmail.com
quarkus.mailer.password=SUA_SENHA_DE_APP
quarkus.mailer.from=SEU_EMAIL@gmail.com

# Em dev, usar mock para não exigir credenciais reais
# %dev.quarkus.mailer.mock=true

