name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: professor-front/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: professor-front
        run: npm ci

      - name: Build frontend
        working-directory: professor-front
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run testes backend
        run: mvn -B -f professor-quarkus/pom.xml test

      - name: Build backend
        run: mvn -B -f professor-quarkus/pom.xml package -DskipTests

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      
      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.0.3
        with: 
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            git pull origin main
            cd professor-quarkus
            ./mvnw quarkus:dev
            cd ..
            cd professor-front
            npm run build

      - name: Restart aplicação VPS
        if: success()
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          # script deploy.sh na VPS: parar e subir de novo a aplicação usando os artefatos copiados.
          # bash $VPS_APP_PATH/deploy.sh
          ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "bash '$VPS_APP_PATH/deploy.sh'"